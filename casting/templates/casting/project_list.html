{% extends 'casting/base.html' %}
{% block content %}
<div class="actions"><h1>Кастинги</h1><a class="btn" href="{% url 'project_create' %}">Создать</a></div>
<table><tr><th>Название</th><th>Заказчик</th><th>Сроки</th><th>Статус</th><th>Заявки</th></tr>{% for p in projects %}<tr><td><a href="{% url 'project_detail' p.id %}">{{ p.title }}</a></td><td>{{ p.client }}</td><td>{{ p.start_date }} — {{ p.end_date }}</td><td>{{ p.get_status_display }}</td><td>{{ p.total_applications }}</td></tr>{% endfor %}</table>
{% endblock %}
