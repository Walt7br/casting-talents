{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кастинг талантов</title>
    <link rel="stylesheet" href="{% static 'casting/css/style.css' %}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{% url 'home' %}">Casting Talents</a>
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Панель</a>
            <a href="{% url 'project_list' %}">Кастинги</a>
            <a href="{% url 'talent_list' %}">Таланты</a>
            <a href="{% url 'application_list' %}">Заявки</a>
            <a href="{% url 'schedule_list' %}">Пробы</a>
            <a href="{% url 'logout' %}">Выход</a>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
        {% endif %}
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
